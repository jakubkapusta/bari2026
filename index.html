Auto odbieracie od razu na lotnisku i jedziecie na południe wzdłuż wybrzeża. Przed południem Polignano, zanim zjadą się wycieczki, po południu pierwsze kroki po Monopoli — bazie na trzy noce.

>! 🕒 Godzina zameldowania | W Monopoli check-in zwykle od 15:00. Jeśli chcecie wejść wcześniej, dogadajcie to z gospodarzem dzień wcześniej.

### CIEKAWOSTKI
D1 | 10:20 | ⚙️ | Most, który trzyma się sam | Ponte Borbonico z XIX w. ma pięć kamiennych łuków i ok. 15 m wysokości nad plażą. To konstrukcja czysto ściskana: każdy łuk przenosi ciężar na filary bez żadnego stalowego zbrojenia, a klucz sklepienia blokuje całość. Most prowadził starą drogą królewską z Bari do Brindisi, dzisiejszą SS16, i do dziś przenosi ruch samochodowy.
D1 | 11:00 | 🎭 | Stąd pochodzi „Volare" | Domenico Modugno, autor „Nel blu dipinto di blu", znanego jako „Volare", urodził się w Polignano w 1928 r. Piosenka z 1958 r. zdobyła dwie pierwsze w historii nagrody Grammy i do dziś jest najczęściej coverowanym włoskim utworem. Jego pomnik z rozłożonymi ramionami stoi nad samym morzem i jest drugim po moście najczęściej fotografowanym miejscem w miasteczku.
D1 | 16:00 | 📖 | Tratwa z belkami na dach | Legenda mówi, że w 1117 r. do portu w Monopoli przypłynęła tratwa z ikoną Madonny, zbudowana z 31 belek. Miastu brakowało wtedy dokładnie belek na dach budowanej katedry, więc użyto tych z tratwy. Kilka z nich przechowuje się do dziś jako relikwie, a miasto świętuje to dwa razy w roku — w grudniu i w sierpniu — nocną procesją z portu do katedry.
D1 | 16:45 | 🎭 | Miasto, które nazwało się „jedyne" | Nazwa Monopoli pochodzi z greki: monos i polis, czyli „jedyne miasto". Osadę założyli mieszkańcy pobliskiej Egnazii, uciekając po zniszczeniu swojego miasta. Ruiny Egnazii leżą 15 km stąd nad samym morzem i można je zwiedzać — to opcja na zapas, gdyby zostało wolne pół dnia.
D2 | 9:15 | ⚙️ | Kopuła bez zaprawy | Trulli stawia się z sucho układanego wapienia. Stożkowy dach to fałszywa kopuła: każdy kolejny pierścień płyt (chiancarelle) wysuwa się odrobinę do środka, aż otwór zamyka zwornik. Nie ma łuku ani zaprawy — obciążenie przejmują grube ściany, a masa kamienia daje bezwładność cieplną, więc latem w środku jest chłodno, zimą ciepło. Dach jest dwuwarstwowy: wewnętrzna warstwa dźwiga, zewnętrzna odprowadza deszczówkę do cysterny pod podłogą.
D2 | 10:30 | 🎭 | Dom, za który groziło więzienie | Casa d'Amore z 1797 r. to pierwszy budynek w Alberobello postawiony na zaprawie. Wcześniej hrabiowie Acquaviva zabraniali trwałego budowania, bo osada bez murowanych domów nie płaciła podatku królowi — dach na sucho dawało się rozebrać przed kontrolą. Gdy w 1797 r. król Ferdynand IV nadał miejscowości status miasta królewskiego, Casa d'Amore stanęła jako manifest wolności.
D2 | 11:15 | ⚙️ | Dlaczego tylko jeden trullo ma piętro | Trullo Sovrano to jedyny dwukondygnacyjny trullo, bo fałszywa kopuła nie znosi obciążenia stropem. Tutaj rozwiązano to inaczej: piętro opiera się na sklepieniu kolebkowym, a schody wchodzą po zewnętrznej ścianie. Budowla z połowy XVIII w. ma 14 m wysokości i grube na ponad metr ściany.
D2 | 12:00 | ⚙️ | Dachy „cummerse" | W Locorotondo domy nie mają stożków, tylko wąskie dwuspadowe dachy kryte kamiennymi płytami (chiancarelle) układanymi jak dachówki. Spadek jest stromy, żeby deszcz szybko spływał do cystern — na Murgii woda była cenniejsza niż kamień. Stąd charakterystyczny profil, z którego miasteczko słynie.
D2 | 20:00 | 💡 | Jak działa fornello pronto | W dzień to zwykłe masarnie, a wieczorem stawiają stoliki i odpalają piec na węglu. Nie ma karty: podchodzicie do lady, wskazujecie mięso i ilość, a masarz nadziewa je na ruszt. Płaci się za wagę, więc łatwo zamówić po kawałku z kilku rodzajów. W oczekiwaniu zamawia się capocollo i lokalne sery. Wieczorem bywają kolejki — warto zadzwonić wcześniej.

D3 | 15:30 | 💡 | Jak mieszkało się w grocie | W jednej izbie mieszkała rodzina z dziećmi, osłem i kurami — zwierzęta w nocy ogrzewały wnętrze. Łóżko stawiano na wysokich nogach, a pod nim spały dzieci; obornik z części zwierzęcej służył jako opał i nawóz. Woda spływała do cysterny wykutej pod podłogą. Przed wysiedleniem śmiertelność niemowląt w Sassi sięgała kilkudziesięciu procent.
D4 | 12:15 | 🎭 | Mikołaj „wykradziony" z Myry | W 1087 r. żeglarze z Bari wywieźli relikwie św. Mikołaja z Myry w dzisiejszej Turcji, uprzedzając Wenecjan, którzy mieli ten sam plan. Bazylikę zaczęto budować specjalnie dla nich jeszcze w tym samym roku. Do dziś z grobu zbiera się „mannę", czyli wilgoć skraplającą się w krypcie, a Bari jest jednym z niewielu miejsc na Zachodzie, gdzie prawosławni mają własną kaplicę w katolickiej świątyni.

<script>
const TAB_NAMES=['plan','jedzenie'];
const TZ='Europe/Rome';
function sw(i){document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('on',j===i));document.querySelectorAll('.pnl').forEach((p,j)=>p.classList.toggle('on',j===i));const np=document.getElementById('nowPill');if(np)np.style.display=(i===0&&np.dataset.has==='1')?'flex':'none'}
function selectTab(i){sw(i);try{history.replaceState(null,'','#'+TAB_NAMES[i])}catch(e){location.hash=TAB_NAMES[i]}}
function tabFromHash(){const h=decodeURIComponent(location.hash.slice(1));if(/^d\d+$/.test(h))return 0;const i=TAB_NAMES.indexOf(h);return i>=0?i:0}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

// ── Warianty dnia (A/B) ──
// Deklaracja w bloku dnia:  ? A* | Etykieta | Krótki opis | Kiedy wybrać
// (gwiazdka = wariant domyślny; linia „? " bez „ | " to nagłówek decyzji)
// Punkt harmonogramu należący do wariantu:  - A> 12:05 | Tytuł | Opis | Map query
function addVariant(cd,body){
  if(body.indexOf(' | ')<0){cd.vh=body;return}
  const p=body.split(' | '),raw=(p[0]||'').trim(),def=raw.endsWith('*');
  const k=(def?raw.slice(0,-1):raw).trim().toUpperCase();
  if(!k)return;
  cd.vr.push({k,lb:(p[1]||'').trim(),sh:(p[2]||'').trim(),cond:(p[3]||'').trim(),def});
}
function scPoint(body){
  const p=body.split(' | ');
  let tm=p[0]||'',v='';
  const m=tm.match(/^\s*([A-Z])>\s*/);
  if(m){v=m[1];tm=tm.slice(m[0].length)}
  return{tm,ti:p[1]||'',nt:p[2]||'',mq:(p[3]||'').trim(),v};
}
function newDay(head){const p=head.split(' | ');return{lb:p[0]||'',ds:p[1]||'',ts:p[2]||'',ht:p[3]||'',sm:'',sc:[],vr:[],vh:'',nt:[]}}
// Notka dnia: `> 🌡️ Etykieta | treść` (`>!` = akcja do wykonania, nie sama informacja)
function addNote(cd,body,act){
  const t=body.trim();if(!t)return;
  const m=/^(\p{Extended_Pictographic}️?)\s*/u.exec(t);
  const rest=m?t.slice(m[0].length):t,i=rest.indexOf(' | ');
  cd.nt.push({ic:m?m[1]:'',lb:i<0?'':rest.slice(0,i).trim(),tx:(i<0?rest:rest.slice(i+3)).trim(),act:!!act});
}
// Klucz, pod którym ciekawostka przykleja się do punktu: dzień + ewentualny wariant + czas
function tipKey(day,v,tm){return day+'_'+(v?v+'>':'')+tm}
function parse(text){
  const lines=text.split('\n'),meta={},parts=[],food=[],tips=[];
  let sec='',cp=null,cd=null;
  for(const raw of lines){
    const t=raw.trim();
    if(t.startsWith('### ')){sec=t.slice(4).trim();continue}
    if(sec==='META'){const m=t.match(/^(\w+):\s*(.+)$/);if(m)meta[m[1]]=m[2];continue}
    if(sec==='JEDZENIE'){if(!t||t.startsWith('#'))continue;const g=t.split(' :: ');if(g.length>=2){const p=g[1].split(' | ');const recs=(p[3]||'').trim()?p[3].split(';;').map(r=>{const a=r.split('@');return{nm:a[0].trim(),mq:(a[1]||a[0]).trim()}}).filter(r=>r.nm):[];food.push({grp:g[0].trim(),lb:(p[0]||'').trim(),dt:(p[1]||'').trim(),mq:(p[2]||'').trim(),recs})}continue}
    if(sec==='CIEKAWOSTKI'){
      if(!t||t.startsWith('#'))continue;
      const p=t.split(' | ');
      if(p.length>=5){
        const dm=p[0].trim().match(/^D(\d+)$/);
        // Pole czasu może wskazywać kilka punktów naraz: „A>16:00; B>6:00"
        if(dm){const tm=p[1].trim();
          const keys=tm.split(';').map(x=>x.trim()).filter(Boolean).map(x=>{const vm=x.match(/^([A-Z])>\s*(.+)$/);return vm?{v:vm[1],tm:vm[2].trim()}:{v:'',tm:x}});

        }

    }
    if(sec==='PLAN'){
      if(t.startsWith('# ')){cp={title:t.slice(2).trim(),days:[]};parts.push(cp);cd=null;continue}
      if(t.startsWith('== ')){cd=newDay(t.slice(3));if(cp)cp.days.push(cd);continue}
      if(t.startsWith('? ')&&cd){addVariant(cd,t.slice(2).trim());continue}
      if(t.startsWith('>! ')&&cd){addNote(cd,t.slice(3),true);continue}
      if(t.startsWith('> ')&&cd){addNote(cd,t.slice(2),false);continue}
      if(t.startsWith('- ')&&cd){cd.sc.push(scPoint(t.slice(2)));continue}
      if(t&&cd&&!t.startsWith('#')&&!t.startsWith('==')){cd.sm+=(cd.sm?' ':'')+t;continue}
    }
  }
  return{meta,parts,food,tips}
}

function sunTimes(ds,lat,lon){
  const rad=Math.PI/180,deg=180/Math.PI;
  const Jdate=new Date(ds+'T00:00:00Z').getTime()/86400000+2440587.5;
  const n=Math.round(Jdate-2451545.0+0.0008+lon/360);
  const Jstar=n-lon/360;
  const M=((357.5291+0.98560028*Jstar)%360+360)%360;
  const C=1.9148*Math.sin(M*rad)+0.02*Math.sin(2*M*rad)+0.0003*Math.sin(3*M*rad);
  const L=((M+C+180+102.9372)%360+360)%360;
  const Jtransit=2451545.0+Jstar+0.0053*Math.sin(M*rad)-0.0069*Math.sin(2*L*rad);

  const w=Math.acos(cosW)*deg;
  const f=j=>new Intl.DateTimeFormat('pl-PL',{timeZone:TZ,hour:'numeric',minute:'2-digit'}).format(new Date((j-2440587.5)*86400000));
  return{rise:f(Jtransit-w/360),set:f(Jtransit+w/360)};
}

      const isFlight=/^lot/i.test(od.ht),plainHt=isFlight||/do ustalenia/i.test(od.ht);
      const htLink=plainHt?esc(od.ht):`<a class="mlink" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(od.ht)}" target="_blank" rel="noopener">${esc(od.ht)}</a>`;
      if(od.ht)h1+=`<div class="dht">${isFlight?'✈️':'🏨'} ${htLink}</div>`;
      h1+='</div></div>';
    });
  });
  if(!imgCredits){
    const credited=Object.values(DAY_IMG).flat().filter(im=>im.by);
    if(credited.length)imgCredits='<details class="img-credits"><summary>📷 Źródła zdjęć — Wikimedia Commons</summary><div class="img-credits-b">'+credited.map(im=>`${esc(im.t)}${imgCredit(im)}`).join('<br>')+'</div></details>';
  }
  document.getElementById('pplan').innerHTML=nav+'</div>'+h1+imgCredits;
  updateNowMode();
}

function saveChk(store,s){try{localStorage.setItem(store,JSON.stringify(s))}catch(e){}}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9ąćęłńóśźż]+/g,'-').replace(/^-|-$/g,'').slice(0,48)}

// Ikony grup w Jedzeniu — monoliniowe SVG (emoji w kolorowym kwadracie wyglądały źle)
const FOOD_ICON={

  plate:'<ellipse cx="12" cy="13.2" rx="9" ry="5.4"/><ellipse cx="12" cy="13.2" rx="4.8" ry="2.7"/>',

  wheat:'<path d="M12 21v-9"/><path d="M12 12c-2.2 0-3.8-1.6-3.8-3.8 2.2 0 3.8 1.6 3.8 3.8Zm0 0c2.2 0 3.8-1.6 3.8-3.8-2.2 0-3.8 1.6-3.8 3.8Z"/><path d="M12 7.5c-1.8 0-3-1.4-3-3.2 1.8 0 3 1.4 3 3.2Zm0 0c1.8 0 3-1.4 3-3.2-1.8 0-3 1.4-3 3.2Z"/>',
  coffee:'<path d="M4.5 8.5h12v5.8a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4Z"/><path d="M16.5 10h1.6a2.4 2.4 0 0 1 0 4.8h-1.6"/><path d="M7.5 3.5v2M11 3v2.5"/>',

};
function foodIcon(k){return `<svg class="gi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${FOOD_ICON[k]||FOOD_ICON.plate}</svg>`}
const FOOD_MON={'Street food':['bread','p-1'],'Makarony i pierwsze dania':['plate','p-2'],'Z morza':['fish','p-3'],'Dolina Itrii':['flame','p-1'],'Altamura i Matera':['wheat','p-2'],'Słodkie i kawa':['coffee','p-3'],'Wino':['wine','p-1']};
function toggleFood(key){const s=getChk(FOOD_STORE);s[key]=!s[key];saveChk(FOOD_STORE,s);renderFood()}
function renderFood(){
  const s=getChk(FOOD_STORE),items=D.food;
  const groups=[],map={};
  items.forEach(it=>{const g=it.grp;if(!map[g]){map[g]={grp:g,items:[]};groups.push(map[g])}map[g].items.push(it)});
  const totalDone=items.filter(it=>s[slug(it.lb)]).length;
  let h=`<div class="ck-top"><div class="ck-bar"><div class="ck-bar-f" style="width:${items.length?Math.round(totalDone/items.length*100):0}%"></div></div><div class="ck-top-l">${totalDone} / ${items.length}</div></div>`;
  groups.forEach(g=>{
    const gd=g.items.filter(it=>s[slug(it.lb)]).length;
    const mon=FOOD_MON[g.grp]||['plate','p-1'];
    h+=`<div class="ck-grp ${mon[1]}">${foodIcon(mon[0])}<span class="ck-gt2">${esc(g.grp)}</span><span class="gl"></span><span class="ck-gc2">${gd}/${g.items.length}</span></div><div class="ck-card">`;
    g.items.forEach(it=>{const key=slug(it.lb),ck=!!s[key];
      let txt='<b>'+esc(it.lb)+'</b>'+(it.dt?'<span class="ck-d"> — '+esc(it.dt)+'</span>':'');
      if(it.mq)txt+=' '+mapChip(it.mq);
      if(it.recs.length)txt+='<span class="food-recs">'+it.recs.map(r=>mapChip(r.mq,esc(r.nm))).join('')+'</span>';
      h+=`<div class="ck-row ${ck?'ck-on':''}" onclick="toggleFood('${key}')"><span class="ck-cb">${ck?'✓':''}</span><span class="ck-tx">${txt}</span></div>`;
    });
    h+='</div>';
  });
  document.getElementById('pfood').innerHTML=h;
}
renderFood();

// ── Odliczanie w nagłówku ──
function daysUntil(dateStr){const d=new Date(dateStr+'T00:00:00'),t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/86400000)}
(function(){const el=document.getElementById('cdHead');if(!el||!D.meta.start)return;const diff=daysUntil(D.meta.start);if(diff>0)el.innerHTML=PLANE_SVG+' Do wylotu: '+diff+(diff===1?' dzień':' dni');else if(diff===0)el.innerHTML=PLANE_SVG+' Dziś wylot! 🇮🇹';else if(diff>-TRIP_DAYS)el.textContent='🇮🇹 Wycieczka trwa — buon viaggio!';else el.style.display='none';})();

// ── Easter egg: 3× klik w odliczanie → pies żegna na drogę ──
(function(){
  const trg=document.getElementById('cdHead');
  if(!trg)return;
  let clicks=[],hideT=null;
  trg.addEventListener('click',()=>{
    const now=Date.now();
    clicks=clicks.filter(t=>now-t<1200);clicks.push(now);
    if(clicks.length>=3){clicks=[];showDog();}
  });
  function showDog(){
    let d=document.getElementById('dogEgg');
    if(!d){
      d=document.createElement('div');d.id='dogEgg';d.className='dog-egg';
      d.innerHTML='<img src="img/dog.png" alt="Nasz pies" draggable="false">';
      d.addEventListener('click',hideDog);
      document.body.appendChild(d);
    }
    clearTimeout(hideT);
    d.style.pointerEvents='auto';
    d.classList.remove('out');
    void d.offsetWidth; // restart animacji przy ponownym kliknięciu
    d.classList.add('in');
    hideT=setTimeout(hideDog,6000);
  }
  function hideDog(){
    const d=document.getElementById('dogEgg');if(!d)return;
    clearTimeout(hideT);
    d.style.pointerEvents='none';
    d.classList.remove('in');d.classList.add('out');
  }
})();

// ── Tryb „TERAZ": podświetlenie dzisiejszego dnia i bieżącego punktu planu ──
// Dzień N = start (D.meta.start = dzień 1) + N−1; czas liczony wg strefy Włoch (ta sama co Polska).
function tripDayNum(){
  if(!D.meta.start)return null;
  const cur=tzParts(TZ);if(!cur)return null;
  const n=Math.round((new Date(cur.d+'T00:00:00Z')-new Date(dayDate(1)+'T00:00:00Z'))/86400000)+1;
  return(n>=1&&n<=TRIP_DAYS)?n:null;
}
function ensureNowPill(){
  let p=document.getElementById('nowPill');
  if(!p){
    p=document.createElement('div');p.id='nowPill';p.className='now-pill noprint';
    p.innerHTML='<span class="np-k">▶ TERAZ</span><span class="np-body"><span class="np-t"></span><span class="np-n"></span></span>';
    p.onclick=()=>{if(p._target){p._target.scrollIntoView({block:'center',behavior:'smooth'})}};
    document.body.appendChild(p);
  }
  return p;
}
function updateNowMode(){
  document.querySelectorAll('.sr-now,.sr-past').forEach(el=>el.classList.remove('sr-now','sr-past'));
  document.querySelectorAll('.today-pill').forEach(el=>el.remove());
  document.querySelectorAll('.dc-today').forEach(el=>el.classList.remove('dc-today'));
  const pill=ensureNowPill();
  const n=tripDayNum();
  const off=()=>{pill.dataset.has='0';pill.style.display='none'};
  if(n===null){off();return}
  const dc=document.getElementById('d'+n);
  if(!dc){off();return}
  dc.classList.add('dc-today');
  const dn=dc.querySelector('.dh .dn');
  if(dn){const sp=document.createElement('span');sp.className='today-pill';sp.textContent='DZIŚ';dn.appendChild(sp)}
  const cur=tzParts(TZ);
  if(!cur){off();return}
  const rows=[...dc.querySelectorAll('.sr')].map(el=>{const m=(el.dataset.tm||'').match(/^(\d{1,2}):(\d{2})/);return m?{el,min:+m[1]*60+ +m[2]}:null}).filter(Boolean);
  let curRow=null,nextRow=null;
  rows.forEach(r=>{if(r.min<=cur.min)curRow=r;else if(!nextRow)nextRow=r});
  rows.forEach(r=>{if(curRow&&r.min<curRow.min)r.el.classList.add('sr-past')});
  if(curRow)curRow.el.classList.add('sr-now');
  const titleOf=r=>{const s=r.el.querySelector('.sc strong');return s?s.textContent.trim():''};
  pill.querySelector('.np-t').textContent=curRow?(curRow.el.dataset.tm+' · '+titleOf(curRow)):('Dzień '+n+' — plan startuje o '+(rows[0]?rows[0].el.dataset.tm:'?'));
  let nt='';
  if(nextRow){const df=nextRow.min-cur.min,hh=Math.floor(df/60),mm=df%60;nt='za '+(hh?hh+' h ':'')+(mm||!hh?mm+' min':'')+' → '+titleOf(nextRow)}
  const npn=pill.querySelector('.np-n');npn.textContent=nt;npn.style.display=nt?'':'none';
  pill._target=curRow?curRow.el:dc;
  pill.dataset.has='1';
  pill.style.display=document.getElementById('pplan').classList.contains('on')?'flex':'none';
}
renderPlanTab();
setInterval(updateNowMode,60000);

// ── Pogoda: Open-Meteo (bez klucza), jedno zapytanie o wszystkie lokalizacje, cache 3h ──
function fetchWx(){
  if(!navigator.onLine||URL_NOW)return; // w podglądzie ?now= daty leżą poza prawdziwym horyzontem prognozy → API zwraca 400
  const c=getWxCache();
  if(c.ts&&c.v===WX_V&&Date.now()-c.ts<3*3600*1000)return; // cache w starym formacie = odśwież od razu, nie czekaj na TTL
  if(!D.meta.start||!TRIP_DAYS)return;
  const today=tzParts(TZ);if(!today)return;
  const addD=(ds,k)=>{const t=new Date(ds+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+k);return t.toISOString().slice(0,10)};
  const start=dayDate(1)>today.d?dayDate(1):today.d;
  const horizon=addD(today.d,15);
  const end=dayDate(TRIP_DAYS)<horizon?dayDate(TRIP_DAYS):horizon;
  if(start>end)return; // poza 16-dniowym horyzontem prognozy albo po wycieczce
  const coords=[],idx={};
  for(let n=1;n<=TRIP_DAYS;n++){const g=DAY_GEO[n];if(!g)continue;const k=g.join(',');if(!(k in idx)){idx[k]=coords.length;coords.push(g)}}
  if(!coords.length)return;
  const url='https://api.open-meteo.com/v1/forecast?latitude='+coords.map(c=>c[0]).join(',')+'&longitude='+coords.map(c=>c[1]).join(',')+'&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&hourly=precipitation_probability,precipitation&timezone='+encodeURIComponent(TZ)+'&start_date='+start+'&end_date='+end;
  fetch(url).then(r=>r.json()).then(j=>{
    const arr=Array.isArray(j)?j:[j];
    const byDay={};
    for(let n=1;n<=TRIP_DAYS;n++){
      const g=DAY_GEO[n];if(!g)continue;
      const loc=arr[idx[g.join(',')]];
      if(!loc||!loc.daily||!loc.daily.time)continue;
      const ds=dayDate(n);
      const di=loc.daily.time.indexOf(ds);
      if(di<0)continue;
      const rec={tx:loc.daily.temperature_2m_max[di],tn:loc.daily.temperature_2m_min[di],pp:loc.daily.precipitation_probability_max[di]};
      // godzinowe 6:00–23:00 tylko dla daty tego dnia — do cache trafia sam wycinek, nie cała odpowiedź
      const ht=loc.hourly&&loc.hourly.time;
      if(ht){
        const hp=[],hm=[];let found=false;
        for(let k=0;k<WX_HN;k++){
          const hi=ht.indexOf(ds+'T'+String(WX_H0+k).padStart(2,'0')+':00');
          if(hi>=0)found=true;
          hp.push(hi<0?0:Math.round(loc.hourly.precipitation_probability[hi]||0));
          hm.push(hi<0?0:Math.round((loc.hourly.precipitation[hi]||0)*10)/10);
        }
        if(found){rec.hp=hp;rec.hm=hm}
      }
      byDay[n]=rec;
    }
    if(Object.keys(byDay).length){
      try{localStorage.setItem('bari26_wx',JSON.stringify({v:WX_V,ts:Date.now(),d:byDay}))}catch(e){}
      renderPlanTab();
    }
  }).catch(()=>{});
}
fetchWx();
setInterval(fetchWx,30*60*1000);
